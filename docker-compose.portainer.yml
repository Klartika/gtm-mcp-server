services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-google-tag-manager
    restart: unless-stopped

    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Persist issued tokens so users stay authenticated across restarts.
      TOKEN_STORE_PATH: /data/tokens.json

    volumes:
      - mcp_tokens:/data

    networks:
      - npm_mcp_gtm

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mcp_tokens:

networks:
  # Shared with NPM ONLY (Klartika fleet-ops PLAN 11.124; created by fleet-ops networks.sh).
  # Was the flat docker_bridge until 2026-10-01. Not internal: this container's only route out.
  npm_mcp_gtm:
    external: true
